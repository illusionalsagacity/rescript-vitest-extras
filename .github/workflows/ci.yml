name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v7

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      - name: Build ReScript
        run: yarn res:build

      - name: Run unit coverage
        run: yarn coverage

      - name: Run browser coverage
        run: yarn coverage:browser
